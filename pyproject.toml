[project]
name = "think-tank"
version = "0.1.0"
description = "Local-first idea workspace for developing durable, versioned artifacts with AI agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aisuite[anthropic,google,ollama,openai]>=0.1.14",
    "google-genai>=1.2.0",
    "pydantic>=2.13.3",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "typer>=0.25.0",
]

[project.scripts]
think = "think_tank.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
